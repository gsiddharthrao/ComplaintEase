name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Approve pnpm builds
        run: pnpm approve-builds --all

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Shared Package
        run: pnpm --filter @complaintease/shared build

      - name: Typecheck Workspace
        run: |
          pnpm --filter @complaintease/api typecheck
          pnpm --filter @complaintease/web typecheck

      - name: Run Test Suite
        run: pnpm --filter @complaintease/api test

      - name: Build Frontend & Backend
        run: |
          pnpm --filter @complaintease/web build
          pnpm --filter @complaintease/api build

